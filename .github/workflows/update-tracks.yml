name: Update track catalogs

on:
  push:
    branches:
      - main

concurrency:
  group: update-tracks-main
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Regenerate catalog and by-racer manifests
        run: python scripts/update_tracks.py
      - name: Validate manifest and GPX files
        run: python scripts/validate_tracks.py
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4